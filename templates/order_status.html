<!DOCTYPE html>
<html>
<head>
    <title>Order Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #333; margin-bottom: 20px; }
        .order-id { background: #f0f0f0; padding: 10px; border-radius: 8px; font-family: monospace; word-break: break-all; margin: 10px 0; }
        .status { font-size: 20px; font-weight: bold; margin: 20px 0; }
        .status.pending { color: #856404; }
        .status.paid { color: #155724; }
        .status.expired { color: #721c24; }
        .btn { display: inline-block; padding: 12px 30px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Order Status</h1>
        <p><strong>Order ID:</strong></p>
        <div class="order-id">{{ order_id }}</div>
        
        <div class="status" id="statusDisplay">
            <span class="status pending">⏳ Checking...</span>
        </div>
        
        <a href="/" class="btn">⬅ Back</a>
    </div>
    
    <script>
        const orderId = "{{ order_id }}";
        
        async function checkStatus() {
            try {
                const response = await fetch(`/check_order/${orderId}`);
                const data = await response.json();
                
                const statusDiv = document.getElementById('statusDisplay');
                
                if (data.paid) {
                    statusDiv.innerHTML = `<span class="status paid">✅ PAID</span>`;
                    statusDiv.innerHTML += `<p style="margin-top:10px;">Payment successful!</p>`;
                } else if (data.expired) {
                    statusDiv.innerHTML = `<span class="status expired">⏰ EXPIRED</span>`;
                    statusDiv.innerHTML += `<p style="margin-top:10px;">Order expired. Please create a new one.</p>`;
                } else {
                    statusDiv.innerHTML = `<span class="status pending">⏳ PENDING</span>`;
                    statusDiv.innerHTML += `<p style="margin-top:10px;">Waiting for payment...</p>`;
                }
            } catch (error) {
                document.getElementById('statusDisplay').innerHTML = `<span class="status expired">❌ Error checking status</span>`;
            }
        }
        
        checkStatus();
        setInterval(checkStatus, 5000);
    </script>
</body>
</html>
